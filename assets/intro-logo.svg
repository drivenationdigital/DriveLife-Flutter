<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="Layer_1" version="1.1" viewBox="0 0 210.4 170.4" role="img" aria-label="DriveLife flag logo">
  <!-- The supplied file painted itself in with a SMIL <animate> on a
       clipPath, and coloured itself from a <style> block. flutter_svg
       plays neither: it ignores <style> (the paths would come out
       black on black) and it has no SMIL timeline at all, so the
       clip rect would stay at its starting height of 0 and the logo
       would simply never appear.

       So this is the static artwork with the fills inlined, and the
       top-to-bottom reveal is done in Flutter — see
       lib/screens/auth/splash_screen.dart, which clips this with the
       same easing and timing the <animate> asked for. -->
