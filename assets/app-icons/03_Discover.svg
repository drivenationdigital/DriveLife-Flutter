<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 128 128">
  <!-- Inline strokes, not CSS classes. See nav-icons/01-home.svg.

       flutter_svg ignores <style> blocks entirely. Illustrator exports
       its stroke settings into one, so `fill: none; stroke: #2b2b2b`
       never reached these paths and they fell back to the SVG default
       of a solid black fill with no stroke — which is why the map icon
       rendered as a filled blob while every icon beside it was a line
       drawing.

       Every attribute the .st0/.st1 classes used to set is now on the
       paths themselves. Re-exporting from Illustrator will undo this. -->
  <path
    fill="none"
    stroke="#2b2b2b"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M17,48.4c0-2.2,1.1-3.8,3.2-4.8l26.3-11c1.7-.7,3.3-.7,5,0l24.6,11.5,31.4-12.5c3.2-1.1,4.8.3,4.8,4.4v51.1l-32.3,14.4c-1.5.7-3.1.7-4.6,0l-26.4-11.8-28.5,11.5c-2.3.9-3.5,0-3.5-3.1,0,0,0-49.7,0-49.7Z"/>
  <path
    fill="none"
    stroke="#2b2b2b"
    stroke-width="9.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M49,33.6v54.2M77,44.2v54.2"/>
</svg>
